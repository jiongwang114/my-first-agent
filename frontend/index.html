<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - 商业级流式交互</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Agent Console</h1>
            <span class="status-indicator"></span>
        </header>

        <main id="chat-history" class="chat-history">
            <div class="message assistant">
                <div class="avatar">✨</div>
                <div class="message-content">
                    你好，我是你的专属 AI 智能体。支持全网搜索与复杂计算，请问有什么可以帮你？
                </div>
            </div>
        </main>

        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="给 Agent 发送指令... (Shift + Enter 换行)" rows="1"></textarea>
                <button id="send-btn" title="发送">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="disclaimer">AI 可能会产生幻觉，请核实重要信息。</div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
